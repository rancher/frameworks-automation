automation_repo: rancher/release-automation
github_actor: tomleb

# Rancher main (v2.17). webhook main is at its latest tag, so the cascade
# picks it up at paired-latest and goes straight to the rancher bump: no
# rancher/charts stage to wait on.
trigger:
  leaf_branch: main
  independents: {}

modules:
  rancher: [github.com/x/rancher]
  webhook: [github.com/x/webhook]

repos:
  x/rancher:
    gh_repo: x/rancher
    default_branch: main
    tags: [v2.17.0-alpha1]
    branches:
      main:
        files:
          go.mod: |
            module github.com/x/rancher
            go 1.24
            require github.com/x/webhook v0.13.0-rc.10
        ahead_of:
          v2.17.0-alpha1: 0

  x/webhook:
    gh_repo: x/webhook
    default_branch: main
    tags: [v0.13.0-rc.11, v0.13.0-rc.10]
    branches:
      main:
        files:
          go.mod: |
            module github.com/x/webhook
            go 1.24
        ahead_of:
          v0.13.0-rc.11: 0
    tag_files:
      v0.13.0-rc.11:
        go.mod: |
          module github.com/x/webhook
          go 1.24
